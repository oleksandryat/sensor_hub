name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --file-reporter json:test-results.json

      # Compiles the plugin's C sources for the host, so it needs no emulator.
      - name: Test sensorhub_stats
        working-directory: packages/sensorhub_stats
        run: flutter pub get && flutter test

      - name: Coverage gate (80% of lib/domain + lib/data)
        run: dart run tool/check_coverage.dart coverage/lcov.info 80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
