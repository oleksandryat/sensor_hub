name: sensor_hub
description: "IoT device companion app connecting to an MQTT broker, with a Native Lab covering Flutter <-> native communication mechanisms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  get_it: ^9.3.0
  auto_route: ^11.2.0
  mqtt5_client: ^5.0.0
  intl: ^0.20.3
  typed_data: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
