include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"

linter:
  rules:
    prefer_relative_imports: true
